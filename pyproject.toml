[project]
name = "iliad-intensive-c-1-3"
version = "0.1.0"
description = "Claude Code exercises for the ILIAD intensive (C.1.3)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "pytest>=8.0.0",
    "research-scaffold",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]

[tool.uv.sources]
research-scaffold = { git = "https://github.com/jr-brown/research-scaffold.git" }

